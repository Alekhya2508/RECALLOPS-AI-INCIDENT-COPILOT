services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: recallops
      POSTGRES_USER: recallops
      POSTGRES_PASSWORD: recallops
    ports:
      - "5432:5432"
    volumes:
      - recallops-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recallops"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  recallops-postgres:
